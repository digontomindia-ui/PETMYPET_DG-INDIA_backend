services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '${PORT:-4000}:4000'
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/patmypets?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runner
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/patmypets?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend-net]

  # One-shot job: initializes the single-node replica set so the app can use multi-document
  # transactions (required for atomic wallet ledger updates). Runs once and exits.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend-net]
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend-net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks: [backend-net]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    ports:
      - '3001:3000'
    networks: [backend-net]

networks:
  backend-net:

volumes:
  mongo-data:
  redis-data:
