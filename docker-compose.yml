services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '${PORT:-4000}:4000'
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/patmypets
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runner
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/patmypets
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend-net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend-net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks: [backend-net]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    ports:
      - '3001:3000'
    networks: [backend-net]

networks:
  backend-net:

volumes:
  mongo-data:
  redis-data:
