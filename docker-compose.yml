services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - backend-net

  worker:
    build:
      context: .
      target: runner
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
